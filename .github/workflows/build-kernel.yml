name: Build Droidspaces + KernelSU-Next kernel

# Builds an arm64 GKI Image for zorn (Redmi K80 / POCO F7 Pro) with the
# Droidspaces kABI patch and config set, plus KernelSU-Next, and packages it as
# a flashable AnyKernel3 zip.
#
# Source tree note: the official MiCode/Xiaomi_Kernel_OpenSource@bsp-zorn-v-oss
# drop is kernel 6.1.68 and has no build/ directory or tools/bazel, so it needs
# a full Kleaf workspace (CodeLinaro prebuilts, repo manifest, Bazel) to build.
# This workflow uses the LineageOS zorn tree instead, which is a plain-make tree
# on 6.1.176 and keeps the same -android14-11 KMI tag, so `make` alone works.

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Kernel source repository
        required: false
        default: https://github.com/cnmrlin/android_kernel_xiaomi_sm8650.git
      kernel_branch:
        description: Kernel source branch
        required: false
        default: lineage-24.0
      root_solution:
        description: Root solution to integrate
        required: false
        type: choice
        options: [ksu-next, none]
        default: ksu-next
      ksu_ref:
        description: KernelSU-Next ref (dev branch or a tag like v3.4.0)
        required: false
        default: dev
      remove_protected_exports:
        description: Remove the GKI protected-exports list (only if vendor modules fail with EACCES)
        required: false
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'kernel-configs/**'
      - 'patches/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    env:
      KERNEL_REPO: ${{ inputs.kernel_repo || 'https://github.com/cnmrlin/android_kernel_xiaomi_sm8650.git' }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch || 'lineage-24.0' }}
      ROOT_SOLUTION: ${{ inputs.root_solution || 'ksu-next' }}
      KSU_REF: ${{ inputs.ksu_ref || 'dev' }}
      DEVICE_CODENAME: zorn
      # Pinned to the tree's own build.config.constants CLANG_VERSION for
      # android14-6.1, so the compiler matches what the kernel was written for.
      CLANG_VERSION: r487747c

    steps:
      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # A kernel build plus toolchain needs roughly 40 GB. The runner ships
          # with large preinstalled SDKs that this job never uses.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # One list, installed in one transaction. pahole/dwarves is required
          # for BTF generation and is NOT in the runner image's preinstalled
          # set, so it is not optional. Installing it in a separate
          # `apt-get install ... || true` step is what broke the first run:
          # a failing apt returns 0 through the pipeline, so `set -e` killed the
          # script with a bare exit 22 and no visible error.
          sudo apt-get install -y \
            build-essential bc bison flex patch pkg-config git curl tar xz-utils \
            zip unzip cpio rsync kmod perl python3 python-is-python3 \
            libssl-dev libelf-dev libncurses-dev zlib1g-dev libyaml-dev \
            lz4 zstd device-tree-compiler dwarves
          # Fail here with a clear message rather than 40 minutes into the build.
          pahole --version || {
            echo "::error::pahole is missing; BTF generation will fail"
            exit 1
          }

      - name: Fetch clang toolchain
        run: |
          # AOSP serves these from per-year branches and each branch holds only
          # a few clang versions, so the branch and the version have to match.
          # clang-r487747c (the version pinned by this tree's
          # build.config.constants for android14-6.1) lives on
          # main-kernel-build-2023, NOT on -2024, which only has r510928.
          # A wrong pairing returns HTTP 400 and curl exits 22, which is how the
          # first two runs died: a bare "exit code 22" with no useful log.
          # AOSP also serves an empty placeholder for some refs, so the binary
          # is checked for executability rather than trusting the exit code.
          BASE="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads"
          for ref in main-kernel-build-2023 main-kernel-build-2024; do
            url="$BASE/$ref/clang-${CLANG_VERSION}.tar.gz"
            echo "Trying $url"
            if curl -LSsf --retry 3 -o clang.tar.gz "$url" && tar -tzf clang.tar.gz >/dev/null 2>&1; then
              echo "Downloaded from $ref"
              break
            fi
            echo "  not available on $ref"
            rm -f clang.tar.gz
          done

          [ -f clang.tar.gz ] || {
            echo "::error::Could not download clang-${CLANG_VERSION} from any known ref"
            exit 1
          }

          mkdir -p "$HOME/clang"
          tar -xzf clang.tar.gz -C "$HOME/clang"
          rm -f clang.tar.gz
          [ -x "$HOME/clang/bin/clang" ] || {
            echo "::error::clang-${CLANG_VERSION} archive is empty or not executable"
            exit 1
          }
          "$HOME/clang/bin/clang" --version
          echo "$HOME/clang/bin" >>"$GITHUB_PATH"

      - name: Clone kernel source
        run: |
          # --depth 1 only. These trees are several GB and the full history is
          # of no use to a build.
          git clone --depth 1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          echo "Kernel version: $(make kernelversion)"
          # Guard the whole config strategy: the kABI patch and the fragment
          # target 6.1 specifically.
          make kernelversion | grep -q '^6\.1\.' || {
            echo "::error::Expected a 6.1 kernel, got $(make kernelversion)"
            exit 1
          }

      - name: Apply Droidspaces kABI patch
        run: |
          # This is mandatory and it is not a plain `git apply`. The upstream
          # static variants all assume ABI reserve slots 1 and 2 are free, which
          # is false on this tree (it uses 1, 2 and 3) and their hunk context
          # does not match either. The script scans which slots are free and
          # edits include/linux/sched.h by anchor, so line endings and context
          # cannot break it. It refuses to proceed if it cannot verify.
          cd kernel
          git config user.email "ci@localhost"
          git config user.name "CI"
          python3 "$GITHUB_WORKSPACE/scripts/fix-tree.py" "$PWD"
          echo "--- resulting task_struct ABI region ---"
          grep -nE 'ANDROID_KABI_USE\([0-9]+, struct sysv_sem|struct sysv_shm sysvshm' \
            include/linux/sched.h

      - name: Optionally drop GKI protected exports
        if: ${{ inputs.remove_protected_exports }}
        run: |
          # CONFIG_MODULE_SIG_PROTECT enforces a separate allowlist from signing.
          # A stock vendor module can fail with -EACCES if the locally generated
          # lists differ from Xiaomi's. Only needed if Wi-Fi/BT break.
          cd kernel
          ls android/abi_gki_protected_exports_* 2>/dev/null || true
          rm -fv android/abi_gki_protected_exports_*

      - name: Build kernel
        env:
          CONFIG_FRAGMENT: ${{ github.workspace }}/kernel-configs/droidspaces-gki.config
          KERNEL_ROOT: ${{ github.workspace }}/kernel
          OUT_DIR: ${{ github.workspace }}/kernel/out
        run: |
          chmod +x scripts/build-kernel.sh
          KERNEL_ROOT="$KERNEL_ROOT" OUT_DIR="$OUT_DIR" \
          CONFIG_FRAGMENT="$CONFIG_FRAGMENT" \
          ROOT_SOLUTION="$ROOT_SOLUTION" KSU_REF="$KSU_REF" \
          bash scripts/build-kernel.sh

      - name: Package AnyKernel3 zip
        env:
          IMAGE: ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image
          OUT_ZIP: ${{ github.workspace }}/out/AnyKernel3_zorn_droidspaces_ksu-next.zip
        run: |
          chmod +x scripts/package-anykernel3.sh
          IMAGE="$IMAGE" OUT_ZIP="$OUT_ZIP" \
          DEVICE_CODENAME="$DEVICE_CODENAME" \
          KERNEL_STRING="Droidspaces + KernelSU-Next (6.1)" \
          bash scripts/package-anykernel3.sh

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-zorn-droidspaces-ksu-next
          path: kernel/out/arch/arm64/boot/Image
          if-no-files-found: error

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-zorn-droidspaces-ksu-next
          path: out/AnyKernel3_zorn_droidspaces_ksu-next.zip
          if-no-files-found: error

      - name: Upload build config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config-zorn
          path: kernel/out/.config
          if-no-files-found: warn
